<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדגמת רכיבי תגובות ולייקים</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <style>
        :root { color-scheme: light dark; --fg: #1f2937; --muted: #6b7280; --bg: #f7f7fb; --card: #fff; --border: rgba(15,23,42,.12); }
        @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --bg: #0f172a; --card: #16203a; --border: rgba(255,255,255,.12); } }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg); line-height: 1.7;
               font-family: 'Assistant', 'Segoe UI', system-ui, -apple-system, 'Noto Sans Hebrew', sans-serif; }
        main { max-width: 720px; margin: 0 auto; padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 4rem; }
        article { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.6rem; margin-top: 0; }
        .missing { background: #fee2e2; color: #991b1b; border-radius: 12px; padding: 1rem; }
        .hint { color: var(--muted); font-size: .9rem; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    </style>
</head>
<body>
<main>
    <div id="missing" class="missing" hidden>
        חסר מפתח אתר. פתחו את הדף כך: <code>/demo.html?site=SITE_KEY</code>
    </div>

    <article>
        <h1>עמוד לדוגמה</h1>
        <p>זהו עמוד הדגמה שמראה איך שני הרכיבים נראים ומתנהגים בתוך תוכן אמיתי. הלייקים והתגובות
           נשמרים בשרת ומופיעים מיד בדשבורד הניהול.</p>
        <p class="hint">כל דף מזוהה לפי הנתיב שלו, כך שלכל עמוד באתר יש שרשור תגובות משלו.</p>
        <div data-tells="likes"></div>
    </article>

    <hr>

    <div data-tells="comments"></div>
</main>

<script>
    /* The demo page takes the site key from the query string so one file can
       test every site registered in the dashboard. */
    (function () {
        var key = new URLSearchParams(window.location.search).get('site');
        if (!key) {
            document.getElementById('missing').hidden = false;
            return;
        }
        var script = document.createElement('script');
        script.src = '/embed.js';
        script.setAttribute('data-site', key);
        script.defer = true;
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
