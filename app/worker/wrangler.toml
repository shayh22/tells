name = "tells-engage"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The dashboard, the embed script and the demo page are the same files the Node
# server serves. The Worker runs first so it can route /admin/ and /api/v1/
# itself and hand everything else to the asset store.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

# Create the database once with:  npx wrangler d1 create tells-engage
# then paste the id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "tells-engage"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# A "valid email" is checked for syntax and disposable providers, and then for a
# domain that really accepts mail — over DNS-over-HTTPS, since Workers have no
# DNS resolver. Set to "false" to skip the lookup.
EMAIL_DNS_CHECK = "true"
BLOCK_DISPOSABLE_EMAIL = "true"
MAX_COMMENT_LENGTH = "2000"
COMMENT_COOLDOWN_MS = "20000"
COMMENTS_PER_HOUR = "12"
SESSION_TTL_HOURS = "12"

# The dashboard password is a secret, not a var:
#   npx wrangler secret put ADMIN_PASSWORD
